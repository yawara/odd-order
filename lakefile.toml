name = "OddOrder"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["OddOrder"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 1500 # mathlib 準拠の分割上限 (CLAUDE.md「ファイル粒度」、2026-07-24 切替)
# 超過 file は per-file `set_option linter.style.longFile N` (N = candidate/candidate-100 のみ許容)
# で grandfather し、分割 campaign (issue 0149) で stamp を除去していく。

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d" # mathlib tag v4.33.0 (= stable, 2026-08-10)

[[lean_lib]]
name = "OddOrder"
