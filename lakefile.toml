name = "OddOrder"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["OddOrder"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 2000 # 分割上限 (CLAUDE.md「ファイル粒度」、mathlib は 1500)
weak.linter.style.longFileDefValue = 2000 # bound=defValue で「bound 過大」誤警告を抑止

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "360da6fa66c1273b76b6b2d8c5666fd5ac2e3b56"

[[lean_lib]]
name = "OddOrder"
